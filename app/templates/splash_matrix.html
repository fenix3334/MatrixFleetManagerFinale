<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Fleet Manager - Avvio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      color: #00ff41;
      font-family: monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .matrix-title {
      font-size: 2em;
      margin-bottom: 20px;
    }

    .loading-bar {
      width: 80%;
      height: 20px;
      border: 1px solid #00ff41;
      margin-top: 20px;
      position: relative;
    }

    .loading-progress {
      background: #00ff41;
      height: 100%;
      width: 0;
      animation: load 3s forwards;
    }

    @keyframes load {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    .matrix-rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="matrix-title">🚗 Avvio di MATRIX FLEET MANAGER...</div>
  <div class="loading-bar">
    <div class="loading-progress"></div>
  </div>

  <canvas class="matrix-rain"></canvas>

  <script>
    const canvas = document.querySelector(".matrix-rain");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = "01".split("");
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00ff41";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(drawMatrix, 40);

    // Dopo la sequenza animata reindirizza l'utente alla dashboard principale.
    // In precedenza veniva caricata la pagina "percorrenze" ormai rimossa.
    setTimeout(() => {
      window.location.href = "/";
    }, 3200);
  </script>
</body>
</html>
